name: API tests

# GitHub only reads workflows at the repository root, so this one lives here
# and runs inside smarttrip-api. Tests use SQLite in memory (phpunit.xml).
on:
  push:
    branches: [master]
    paths:
      - 'smarttrip-api/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'smarttrip-api/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHP 8.4

    defaults:
      run:
        working-directory: smarttrip-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Same PHP minor as the production VM.
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('smarttrip-api/composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test
