<!--
  EmailJS template "SmartTrip - Email Aksi" (salinan dari dashboard.emailjs.com).
  Dipakai untuk verifikasi pendaftaran dan atur ulang kata sandi, dikirim oleh
  App\Services\EmailJs. Variabel: subject, to_email, heading, message,
  action_label, action_url, note.
  Header: public/images/email-header.png (jembatan senja, dibuat dari
  login_panorama.svg aplikasi), juga tautan ke smarttrips.my.id.
  Di dashboard: Subject = {{subject}}, To Email = {{to_email}},
  From Name = SmartTrip Batam.
-->
<div style="margin:0;padding:24px 12px;background:#F5F7FB;font-family:Arial,Helvetica,sans-serif;color:#14212F;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#FFFFFF;border-radius:16px;overflow:hidden;border:1px solid #DBE2EC;">
    <tr>
      <td style="background:#0A2440;padding:0;line-height:0;">
        <a href="https://smarttrips.my.id" target="_blank" style="display:block;text-decoration:none;">
          <img src="https://smarttrips.my.id/images/email-header.png" width="560" alt="SmartTrip Batam - Rencana liburan Batam, disusun otomatis" style="display:block;width:100%;max-width:560px;height:auto;border:0;color:#FFFFFF;font-size:18px;font-weight:bold;line-height:24px;background:#0A2440;">
        </a>
      </td>
    </tr>
    <tr>
      <td style="padding:28px 28px 8px;">
        <h1 style="margin:0 0 12px;font-size:20px;line-height:28px;color:#0A2440;">{{heading}}</h1>
        <p style="margin:0 0 22px;font-size:15px;line-height:23px;color:#14212F;">{{message}}</p>
        <table role="presentation" cellspacing="0" cellpadding="0">
          <tr>
            <td style="border-radius:12px;background:#2B6FAB;">
              <a href="{{action_url}}" target="_blank" style="display:inline-block;padding:13px 26px;font-size:15px;font-weight:bold;color:#FFFFFF;text-decoration:none;border-radius:12px;">{{action_label}}</a>
            </td>
          </tr>
        </table>
        <p style="margin:22px 0 6px;font-size:13px;line-height:19px;color:#5D6B7C;">Jika tombol tidak berfungsi, salin tautan berikut ke browser:</p>
        <p style="margin:0 0 20px;font-size:12px;line-height:18px;word-break:break-all;"><a href="{{action_url}}" target="_blank" style="color:#2B6FAB;">{{action_url}}</a></p>
        <p style="margin:0 0 24px;padding:12px 14px;background:#EEF2F8;border-radius:10px;font-size:13px;line-height:19px;color:#5D6B7C;">{{note}}</p>
      </td>
    </tr>
    <tr>
      <td style="padding:18px 28px 24px;border-top:1px solid #DBE2EC;">
        <p style="margin:0 0 6px;font-size:13px;line-height:19px;color:#14212F;">Buka SmartTrip: <a href="https://smarttrips.my.id" target="_blank" style="color:#2B6FAB;font-weight:bold;">smarttrips.my.id</a></p>
        <p style="margin:0;font-size:11px;line-height:17px;color:#5D6B7C;">Email ini dikirim otomatis oleh SmartTrip Batam ke {{to_email}}. Mohon tidak membalas email ini.</p>
      </td>
    </tr>
  </table>
</div>
