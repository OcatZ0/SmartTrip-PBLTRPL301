openapi: 3.0.3
info:
  title: 'SmartTrip Batam API'
  description: 'REST API untuk aplikasi mobile SmartTrip (Flutter) - autentikasi, katalog tempat, wishlist, generate itinerary otomatis, swap, live tracking, review, dan share trip.'
  version: 1.0.0
servers:
  -
    url: 'https://smarttrips.my.id'
tags:
  -
    name: Autentikasi
    description: 'Daftar, masuk, dan kelola kata sandi akun wisatawan. Login, daftar, dan lupa kata sandi dibatasi jumlah percobaannya.'
  -
    name: Profil
    description: 'Data akun dan preferensi default untuk trip baru.'
  -
    name: 'Katalog Tempat'
    description: 'Kategori dan tempat wisata Batam. Bisa dibuka tanpa login.'
  -
    name: 'Ulasan Tempat'
    description: 'Satu ulasan per pengguna per tempat; ulasan kedua berarti mengubah yang lama.'
  -
    name: 'Wishlist Pribadi'
    description: 'Tempat yang disimpan pengguna, terpisah dari trip.'
  -
    name: Trip
    description: 'Membuat, melihat, mengubah, dan menghapus trip milik pengguna.'
  -
    name: 'Wishlist Trip'
    description: 'Tempat dan pin yang ingin dikunjungi dalam satu trip, maksimal 100 item.'
  -
    name: 'Penyusunan Itinerary'
    description: 'Langkah menyusun itinerary: minat dan bobot, hotel atau titik awal, generate, lalu tukar atau tandai stop.'
  -
    name: 'Berbagi Trip'
    description: 'Undang viewer lewat email atau link. Viewer hanya bisa melihat, tidak bisa mengubah.'
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Token didapat dari response <code>POST /auth/login</code>, <code>POST /auth/google</code>, atau setelah klik link verifikasi registrasi - berupa Sanctum personal access token (bukan JWT), dipakai sebagai <code>Authorization: Bearer {token}</code>.'
security:
  -
    default: []
paths:
  /api/auth/register:
    post:
      summary: 'Daftar akun'
      operationId: daftarAkun
      description: 'Menyimpan pendaftaran dan mengirim email verifikasi; akun aktif setelah link di email diklik. Maksimal 3 email per alamat per jam.'
      parameters: []
      responses: {}
      tags:
        - Autentikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: '-0pBNvYgxw'
              required:
                - name
                - email
                - password
      security: []
  /api/auth/login:
    post:
      summary: 'Masuk dengan email'
      operationId: masukDenganEmail
      description: 'Mengembalikan token Sanctum untuk header Authorization: Bearer. Maksimal 5 percobaan per menit per email.'
      parameters: []
      responses: {}
      tags:
        - Autentikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - email
                - password
      security: []
  /api/auth/google:
    post:
      summary: 'Masuk dengan Google'
      operationId: masukDenganGoogle
      description: 'Menerima id_token dari Google Sign-In (email harus sudah diverifikasi Google) dan mengembalikan token Sanctum.'
      parameters: []
      responses: {}
      tags:
        - Autentikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  description: ''
                  example: architecto
              required:
                - id_token
      security: []
  /api/auth/forgot-password:
    post:
      summary: 'Lupa kata sandi'
      operationId: lupaKataSandi
      description: 'Mengirim link atur ulang kata sandi ke email. Balasannya selalu sama, email terdaftar atau tidak.'
      parameters: []
      responses: {}
      tags:
        - Autentikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
              required:
                - email
      security: []
  /api/auth/logout:
    post:
      summary: Keluar
      operationId: keluar
      description: 'Mencabut token yang sedang dipakai.'
      parameters: []
      responses: {}
      tags:
        - Autentikasi
  /api/auth/password:
    put:
      summary: 'Ubah kata sandi'
      operationId: ubahKataSandi
      description: 'Akun Google yang belum punya kata sandi tidak perlu mengisi current_password.'
      parameters: []
      responses: {}
      tags:
        - Autentikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: '|]|{+-'
              required:
                - password
  /api/profile/preferences:
    get:
      summary: 'Lihat preferensi'
      operationId: lihatPreferensi
      description: 'Minat dan bobot kriteria default untuk trip baru.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Profil
    put:
      summary: 'Simpan preferensi'
      operationId: simpanPreferensi
      description: 'Rating 0-10 per kriteria dinormalkan jadi bobot dengan total 1; semua 0 berarti bobot sama rata.'
      parameters: []
      responses: {}
      tags:
        - Profil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_ids:
                  type: array
                  description: ''
                  example:
                    - 16
                  items:
                    type: integer
                rating_kategori:
                  type: number
                  description: 'Must be at least 0. Must not be greater than 10.'
                  example: 2
                rating_jarak:
                  type: number
                  description: 'Must be at least 0. Must not be greater than 10.'
                  example: 7
                rating_anggaran:
                  type: number
                  description: 'Must be at least 0. Must not be greater than 10.'
                  example: 6
                rating_rating:
                  type: number
                  description: 'Must be at least 0. Must not be greater than 10.'
                  example: 7
              required:
                - rating_kategori
                - rating_jarak
                - rating_anggaran
                - rating_rating
  /api/user:
    get:
      summary: 'Data akun login'
      operationId: dataAkunLogin
      description: 'Nama, email, peran, dan status kata sandi akun pemilik token.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Profil
  /api/categories:
    get:
      summary: 'Daftar kategori'
      operationId: daftarKategori
      description: 'Semua kategori tempat wisata; ?onboarding=1 hanya kategori yang tampil di onboarding.'
